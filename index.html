<style>
  :root {
    --bg:#0e0e10; --text:#f4f4f6; --muted:#8d8d96; --line:#2a2a2f;
    --peri:#b9c7f5; --peri-ink:#15161c; --peri-soft:#cfd9fa;
    --dark:#232327; --dark2:#2e2e33;
    --late:#e5484d; --late-on-peri:#c2272d; --ok:#2fbf71; --ok-on-peri:#11804a; --warn:#f2b84b;
    --gap:calc(clamp(8px, 1.4vh, 14px) * var(--k, 1));
  }
  * { box-sizing:border-box; }
  /* приложение, а не документ: без выделения текста, «Поиска касанием» и меню на долгое нажатие */
  html, body, * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  img, svg { -webkit-user-drag:none; pointer-events:none; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }   /* главный экран никогда не прокручивается */
  body { position:fixed; inset:0; }            /* iPhone: без «резиновой» прокрутки Safari */
  button { touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:Rubik, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }

  /* весь главный экран = ровно высота окна, без прокрутки */
  main { max-width:520px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; gap:var(--gap);
         padding:calc(env(safe-area-inset-top) + clamp(10px, 2vh, 22px)) calc(env(safe-area-inset-right) + 18px) max(calc(env(safe-area-inset-bottom) + 2px), 8px) calc(env(safe-area-inset-left) + 18px); }

  /* ===== шапка ===== */
  .top { display:flex; align-items:center; gap:10px; flex:none; }
  h1 { margin:0; font-weight:400; letter-spacing:-.6px; line-height:1.05; font-size:clamp(30px, min(10vw, 5.4vh), 46px); }
  .avatar { width:56px; height:56px; border-radius:50%; flex:none; border:2px solid #3a3a40; overflow:hidden; background:#000;
            box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); }
  .avatar img { width:100%; height:100%; display:block; object-fit:cover; }

  /* ===== выбор «работы» — как полоска дней ===== */
  .work { flex:none; display:flex; align-items:center; gap:4px; background:#232327; border-radius:999px; padding:5px;
          box-shadow:inset 0 2px 6px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.05); }
  .work .lbl { flex:.8; text-align:center; color:var(--muted); font-size:15px; font-weight:500; }
  .work button { flex:1; border:0; background:transparent; color:#c9c9d0; border-radius:999px;
                 padding:calc(clamp(11px, 1.7vh, 15px) * var(--k, 1)) 6px; font-size:17px; font-weight:500; white-space:nowrap; }
  .work button.on { background:linear-gradient(180deg, #fff, #eceef5); color:#111; font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 -2px 0 rgba(0,0,0,.06); }

  /* ===== карточки делят оставшуюся высоту поровну ===== */
  .cards { flex:1; min-height:0; display:flex; flex-direction:column; gap:var(--gap); }
  .slot { flex:1; min-height:0; display:flex; }
  .slot > .card { flex:1; }
  .card { flex:1; min-height:0; overflow:hidden; border-radius:22px; padding:calc(clamp(12px, 1.9vh, 20px) * var(--k, 1)) 16px;
          display:flex; flex-direction:column; justify-content:space-between; gap:6px;
          background:linear-gradient(180deg, #c4d0f8 0%, #b6c4f4 55%, #adbcf0 100%); color:var(--peri-ink); border:1.5px solid transparent;
          box-shadow:0 12px 26px -12px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(20,30,90,.08); }
  .card.back { background:linear-gradient(180deg, #45444d 0%, #3c3b44 60%, #36353e 100%); color:var(--text); border-color:#55505e;
               box-shadow:0 12px 26px -12px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.07); }
  .row1 { display:flex; align-items:center; gap:8px; }
  .tag { background:linear-gradient(180deg, #2a2a2e, #0f0f11); color:#fff; border-radius:999px; padding:6px 13px; font-size:15px; font-weight:500; white-space:nowrap;
         box-shadow:0 3px 8px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14); }
  .card.back .tag { background:linear-gradient(180deg, #5a5963, #4b4a54); color:#e6e6ea; box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1); }
  .route-s { flex:1; min-width:0; font-size:15px; color:#3346a8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.back .route-s { color:#9d9da6; }
  .circle { width:34px; height:34px; border-radius:50%; border:0; background:linear-gradient(180deg, #fff, #eceef6); color:#111; display:grid; place-items:center; flex:none;
           box-shadow:0 3px 8px rgba(0,0,0,.22), inset 0 -1px 0 rgba(0,0,0,.06); }
  .card.back .circle { background:linear-gradient(180deg, #232326, #0e0e10); color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1); }
  .circle svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .big { font-family:Nunito, Rubik, system-ui, sans-serif; font-weight:800; letter-spacing:-.4px; line-height:1.05; white-space:nowrap;
         font-size:calc(clamp(30px, min(12.2vw, 7vh), 64px) * var(--k, 1)); }
  .big .w { font-weight:600; opacity:.78; }
  /* дорога с камушками, по ней едет кот на самокате */
  .anim { position:relative; container-type:inline-size; height:calc(clamp(52px, 9.5vh, 90px) * var(--k, 1));
          display:flex; align-items:flex-end; }
  .anim svg.road { width:100%; height:auto; aspect-ratio:320 / 16; display:block; overflow:visible; }
  .pb { fill:#15161c; fill-opacity:.5; }
  .card.back .pb { fill:#e4e7f6; fill-opacity:.6; }
  .rider { position:absolute; bottom:calc(100cqw * 3 / 320); height:calc(100% - 100cqw * 3 / 320);
           transform-origin:50% 100%; pointer-events:none; will-change:left, transform; }
  .card.back .rider svg.cat { transform:scaleX(-1); }      /* в Schanz едет справа налево */
  .rider svg.cat { height:100%; width:auto; aspect-ratio:320 / 313; display:block; overflow:visible; }
  @media (max-height: 560px) { .anim { display:none; } }
  .meta { display:flex; align-items:center; gap:7px; font-size:calc(clamp(15px, min(4.6vw, 2.5vh), 21px) * var(--k, 1)); flex-wrap:wrap; row-gap:2px; }
  .meta svg { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.8; flex:none; }
  .meta .sep { opacity:.45; }
  .st { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; font-weight:600; }
  .meta .st svg, .list .st svg { width:1.15em; height:1.15em; }
  .st-ok { color:var(--ok); } .card:not(.back) .st-ok, .sheet-panel:not(.back) .st-ok { color:var(--ok-on-peri); }
  .st-sched { color:currentColor; opacity:.55; }
  .st-late { background:linear-gradient(180deg, #ef5a5f, #d93d43); color:#fff; border-radius:999px; padding:2px 9px 2px 6px; box-shadow:0 2px 6px rgba(200,40,45,.35), inset 0 1px 0 rgba(255,255,255,.25); }
  .st-early { background:linear-gradient(180deg, #f7c867, #eaa935); color:#111; border-radius:999px; padding:2px 9px 2px 6px; box-shadow:0 2px 6px rgba(200,140,30,.35), inset 0 1px 0 rgba(255,255,255,.3); }
  .st-x { color:var(--late); }
  .legend .st svg { width:14px; height:14px; vertical-align:-2px; }
  .late { color:var(--late); } .ontime { color:var(--ok); } .early { color:var(--warn); } .muted { opacity:.6; }
  .card:not(.back) .late { color:var(--late-on-peri); } .card:not(.back) .ontime { color:var(--ok-on-peri); }
  .card:not(.back) .early { color:#9a5b00; }

  .row3 { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .lines { display:flex; gap:8px; }
  .ln-av { --s:calc(clamp(36px, 5.6vh, 48px) * var(--k, 1)); min-width:var(--s); height:var(--s); padding:0 8px; border-radius:999px; display:grid; place-items:center;
           font-family:Rubik, sans-serif; font-weight:600; font-size:calc(clamp(15px, 2.3vh, 19px) * var(--k, 1)); background:linear-gradient(180deg, #fff, #eceef6); color:#111;
           box-shadow:0 4px 10px rgba(20,30,90,.18), inset 0 -2px 0 rgba(0,0,0,.05); }
  .card.back .ln-av { background:linear-gradient(180deg, #1d1d20, #0f0f11); color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08); }
  .stats { display:flex; align-items:center; gap:10px; font-size:calc(clamp(14px, 2.2vh, 18px) * var(--k, 1)); white-space:nowrap; }
  .stats span { display:inline-flex; align-items:center; gap:5px; }
  .stats svg { width:1.15em; height:1.15em; fill:none; stroke:currentColor; stroke-width:1.8; }
  .stats .trk { background:linear-gradient(180deg, #2a2a2e, #0f0f11); box-shadow:0 3px 8px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12); color:#fff; border-radius:12px; padding:calc(clamp(5px, .9vh, 9px) * var(--k, 1)) 11px; font-family:Rubik, sans-serif; font-weight:600; }
  .card.back .stats .trk { background:linear-gradient(180deg, #eef0fa, #d9ddf0); color:#111; box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 -1px 0 rgba(0,0,0,.06); }

  /* ===== нижняя панель ===== */
  .bar { flex:none; display:flex; align-items:center; gap:10px; padding:0 2px; }
  .bar .status { flex:1; text-align:center; }
  .status { font-size:12.5px; color:var(--muted); line-height:1.35; min-width:0; }
  .status.warn { color:var(--warn); }
  .status a { color:var(--muted); }
  .fab { width:56px; height:56px; border-radius:50%; border:0; background:linear-gradient(180deg, #fff, #e9ebf3); color:#111; display:grid; place-items:center; flex:none;
         box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 -3px 0 rgba(0,0,0,.07); }
  .fab svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .fab.busy svg { animation:spin 1s linear infinite; }
  .fab.offline { box-shadow:0 0 0 3px var(--warn); }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* низкие экраны */
  @media (max-height: 600px) { .route-s { display:none; } }

  /* ===== панель «Все рейсы» — как экран задачи ===== */
  .sheet { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.55); display:flex; flex-direction:column; justify-content:flex-end; }
  .sheet[hidden] { display:none; }
  .sheet-panel { position:relative; max-width:520px; width:100%; margin:0 auto; max-height:88dvh; display:flex; flex-direction:column;
                 border-radius:28px 28px 0 0; overflow:hidden; background:var(--peri); color:var(--peri-ink); }
  .sheet-panel.back { background:#3a3a40; color:var(--text); }
  .sheet-top { padding:14px 18px 18px; }
  .sheet-top .nav { display:flex; justify-content:space-between; margin-bottom:10px; }
  .sheet-top .nav button { border:0; background:transparent; width:36px; height:36px; display:grid; place-items:center; }
  .sheet-top .nav svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .sheet-top h3 { margin:0; font-family:Rubik, sans-serif; font-weight:600; font-size:28px; letter-spacing:-.5px; line-height:1.1; }
  .sheet-top .sub { font-size:13px; opacity:.7; margin-top:6px; }
  .sheet-body { background:#151517; color:var(--text); border-radius:26px 26px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 14px);
                display:flex; flex-direction:column; min-height:0; }
  .sheet-body .h { color:var(--muted); font-size:13px; margin:0 2px 10px; }
  .list { list-style:none; margin:0; padding:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:8px; }
  .list li { display:grid; grid-template-columns:auto 1fr auto; gap:2px 12px; align-items:center;
             background:linear-gradient(180deg, #c4d0f8, #b3c1f2); color:var(--peri-ink); border-radius:16px; padding:10px 12px;
             box-shadow:0 6px 14px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5); }
  .sheet-panel.back .list li { background:linear-gradient(180deg, #33333a, #2a2a30); color:var(--text); box-shadow:0 6px 14px -8px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06); }
  .list .ln { grid-row:span 2; min-width:38px; height:38px; padding:0 8px; border-radius:999px; display:grid; place-items:center;
              background:#fff; color:#111; font-weight:600; }
  .list .t { font-family:Rubik, sans-serif; font-size:19px; font-weight:600; }
  .list .in { font-size:16px; font-weight:600; text-align:right; }
  .list .sub { grid-column:2 / 4; font-size:12.5px; opacity:.8; }
  .sheet-panel:not(.back) .list .late { color:var(--late-on-peri); } .sheet-panel:not(.back) .list .ontime { color:var(--ok-on-peri); }
  .list li.cancelled { opacity:.5; } .list li.cancelled .t { text-decoration:line-through; }
  .list .empty { display:block; text-align:center; background:transparent; color:var(--muted); }
  .legend { margin:10px 2px 0; font-size:11.5px; color:var(--muted); }

  @media (prefers-reduced-motion: reduce) { .fab.busy svg { animation:none; } }
</style>
</head>
<body>
<main>
  <div class="cards" id="cards">
    <div class="slot" id="slot0"></div>
    <div class="work" id="seg"></div>
    <div class="slot" id="slot1"></div>
  </div>

  <div class="bar">

    <div class="status" id="status">Загрузка…</div>
    <button class="fab" id="fab" type="button" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3.2 2.5 11.1a1 1 0 0 0 1.3 1.5l.7-.6V20a1 1 0 0 0 1 1h4.5v-5.5h4V21H18.5a1 1 0 0 0 1-1v-8l.7.6a1 1 0 0 0 1.3-1.5L12 3.2z"/></symbol>
  <symbol id="i-work" viewBox="0 0 24 24"><path d="M5 2h10a1 1 0 0 1 1 1v6h3a1 1 0 0 1 1 1v12H4V3a1 1 0 0 1 1-1zm2 3v2h2V5H7zm4 0v2h2V5h-2zM7 9v2h2V9H7zm4 0v2h2V9h-2zm-4 4v2h2v-2H7zm4 0v2h2v-2h-2zm6-2v2h2v-2h-2zm0 4v2h2v-2h-2zM9 18v4h3v-4H9z"/></symbol>
  <symbol id="i-bus" viewBox="0 0 24 24"><path d="M6 2h12a3 3 0 0 1 3 3v11a2 2 0 0 1-1 1.7V20a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2.3A2 2 0 0 1 3 16V5a3 3 0 0 1 3-3zm-.5 4v5h13V6h-13zM7 13.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></symbol>
</svg>

<script>
"use strict";

// ===== Остановки =====
// match — имя остановки обязано подходить под это правило
// (так "Schanz (Jakobstraße)" не перепутается с "Schanz (Vaalser Straße)").
const STOPS = {
  schanz:      { name: "Schanz",      full: "Schanz (Jakobstraße)", query: "Schanz (Jakobstraße) Aachen", match: /schanz.*jakob/i },
  bushof:      { name: "Bushof",      full: "Bushof",               query: "Bushof Aachen",               match: /bushof/i },
  kaiserplatz: { name: "Kaiserplatz", full: "Kaiserplatz",          query: "Kaiserplatz Aachen",          match: /kaiserplatz/i },
};
const HOME = "schanz";
const WORKS = ["bushof", "kaiserplatz"];

const API = "https://api.transitous.org";
const VERSIONS = ["v6", "v5", "v4", "v3", "v2", "v1"]; // версия API: пробуем по очереди, рабочую запоминаем
const AACHEN = "50.7753,6.0839";
const TZ = "Europe/Berlin";
const REFRESH_MS = 60_000;          // автообновление раз в минуту
const AUTO_REFRESH_LIMIT_MS = 20 * 60_000; // после 20 мин без касаний — пауза (бережём бесплатный сервер)
const TIMEOUT_MS = 12_000;
const STOP_CACHE_DAYS = 14;
const WINDOW_MIN = 45;              // показываем отправления на ближайшие 45 мин (минимум 30 рейсов с остановки)

// ===== Безопасный localStorage =====
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// ===== Сеть =====
// Ошибки помечаются: network — нет связи/таймаут; status — HTTP-код; apiError — сервер ответил осмысленной ошибкой.
async function getJSON(url) {
  let lastErr;
  for (let attempt = 0; attempt < 2; attempt++) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    let r;
    try {
      r = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    } catch (e) {
      lastErr = Object.assign(new Error("network: " + e.message), { network: true });
      clearTimeout(t);
      if (attempt === 0) await new Promise(res => setTimeout(res, 1500));
      continue;
    }
    clearTimeout(t);
    if (r.ok) return await r.json();
    const err = new Error("HTTP " + r.status);
    err.status = r.status;
    try { const body = await r.json(); if (body && body.error) { err.apiError = true; err.message += ": " + body.error; } } catch {}
    if (r.status < 500) throw err;              // 4xx не повторяем
    lastErr = err;
    if (attempt === 0) await new Promise(res => setTimeout(res, 1500));
  }
  throw lastErr;
}

async function apiGet(endpoint, params) {
  const vk = "ver:" + endpoint;
  const known = store.get(vk);
  const order = known ? [known, ...VERSIONS.filter(v => v !== known)] : VERSIONS;
  let lastErr;
  for (const v of order) {
    try {
      const data = await getJSON(`${API}/api/${v}/${endpoint}?${params}`);
      if (v !== known) store.set(vk, v);
      return data;
    } catch (e) {
      lastErr = e;
      if (!(e.status === 404 && !e.apiError)) break;   // другая версия поможет только при «нет такого адреса»
    }
  }
  throw lastErr;
}

// ===== Поиск ID остановки (с кэшем) =====
async function resolveStop(key, force) {
  const ck = "stop3:" + key;
  const cached = store.get(ck);
  if (!force && cached && Date.now() - cached.t < STOP_CACHE_DAYS * 864e5) return cached.id;
  const s = STOPS[key];
  const url = `${API}/api/v1/geocode?type=STOP&numResults=20&place=${AACHEN}&text=${encodeURIComponent(s.query)}`;
  const res = await getJSON(url);
  // город именно Аахен (не Eschweiler, не Düren), немецкие данные (de-…) раньше бельгийских/нидерландских
  const inAachen = m => (m.areas || []).some(a => /^aachen$/i.test(a.name));
  const cands = (res || []).filter(m => s.match.test(m.name) && inAachen(m));
  const hit = cands.find(m => /^de-/.test(m.id)) || cands[0];
  if (!hit) throw new Error(`Остановка «${s.name}» не найдена`);
  store.set(ck, { id: hit.id, name: hit.name, t: Date.now() });
  return hit.id;
}

// ===== Способ 1 (основной): табло отправлений + следующие остановки каждого рейса =====
// Один запрос. Рейс берём, только если он после нашей остановки доезжает до остановки назначения.
async function boardTrips(fromId, fromKey, toKey, time) {
  const params = new URLSearchParams({
    stopId: fromId, time, n: "30", window: String(WINDOW_MIN * 60), mode: "BUS", fetchStops: "true",
  });
  const data = await apiGet("stoptimes", params);
  const list = (data && data.stopTimes) || [];
  if (list.length && !list.some(x => Array.isArray(x.nextStops))) {
    throw Object.assign(new Error("сервер не вернул следующие остановки"), { noStops: true });
  }
  const out = [];
  for (const x of list) {
    const p = x.place || {};
    if (!STOPS[fromKey].match.test(p.name || "")) continue;     // только наша остановка
    if (x.pickupDropoffType === "NOT_ALLOWED") continue;          // посадки нет
    const di = (x.nextStops || []).findIndex(n => STOPS[toKey].match.test(n.name || ""));
    const d = di >= 0 ? x.nextStops[di] : null;
    if (!d || !p.departure) continue;                             // не доезжает
    out.push({
      key: (x.routeShortName || "") + "|" + (p.scheduledDeparture || p.departure),
      line: x.routeShortName || x.displayName || "Bus",
      dep: p.departure, depSched: p.scheduledDeparture || p.departure,
      arr: d.arrival || d.departure,
      realTime: !!x.realTime,
      cancelled: !!(x.cancelled || x.tripCancelled || d.cancelled),
      headsign: x.headsign || "",
      track: p.track || p.scheduledTrack || "",
      via: di,                                                    // сколько остановок по пути
    });
  }
  return finalize(out);
}

// ===== Способ 2 (запасной): поиск маршрутов, только прямые автобусы =====
async function planTrips(fromKey, toKey, time) {
  const [fromId, toId] = await Promise.all([resolveStop(fromKey, false), resolveStop(toKey, false)]);
  const params = new URLSearchParams({
    fromPlace: fromId, toPlace: toId, time,
    maxTransfers: "0", transitModes: "BUS", searchWindow: String(WINDOW_MIN * 60), numItineraries: "10",
  });
  const data = await apiGet("plan", params);
  const out = [];
  for (const it of (data && data.itineraries) || []) {
    const tl = (it.legs || []).filter(l => l.mode !== "WALK");
    if (tl.length !== 1) continue;
    const l = tl[0];
    if (!STOPS[fromKey].match.test(l.from && l.from.name || "")) continue;
    if (!STOPS[toKey].match.test(l.to && l.to.name || "")) continue;
    out.push({
      key: (l.routeShortName || "") + "|" + l.scheduledStartTime,
      line: l.routeShortName || l.displayName || "Bus",
      dep: l.startTime, depSched: l.scheduledStartTime, arr: l.endTime,
      realTime: !!l.realTime, cancelled: !!l.cancelled,
      headsign: l.headsign || "", track: (l.from && (l.from.track || l.from.scheduledTrack)) || "",
      via: Array.isArray(l.intermediateStops) ? l.intermediateStops.length : 3,
    });
  }
  return finalize(out);
}

// Дубликаты (один рейс в нескольких наборах данных) убираем; рейсы «в обход по кольцу»
// (едут намного дольше самого быстрого) не показываем; сортируем по отправлению.
function finalize(out) {
  const seen = new Set();
  let uniq = out.filter(t => t.dep && t.arr && !seen.has(t.key) && seen.add(t.key));
  // один и тот же автобус, проходящий две платформы нашей остановки (одна линия, одно время прибытия):
  // оставляем более позднее отправление
  const byArr = new Map();
  for (const t of uniq) {
    const k = t.line + "|" + t.arr;
    const prev = byArr.get(k);
    if (!prev || new Date(t.dep) > new Date(prev.dep)) byArr.set(k, t);
  }
  uniq = [...byArr.values()];
  const ride = t => (new Date(t.arr) - new Date(t.dep)) / 60000;
  const rides = uniq.filter(t => !t.cancelled).map(ride).filter(m => m > 0);
  const min = rides.length ? Math.min(...rides) : 0;
  const limit = Math.max(2 * min, min + 8);
  return uniq.filter(t => !min || ride(t) <= limit)
             .sort((a, b) => new Date(a.dep) - new Date(b.dep));
}

// Статус рейса значком: галочка — вовремя; часы +N мин — опоздание; стрелка −N мин — раньше; календарь — только расписание; крестик — отмена
function badge(t) {
  if (t.cancelled) return `<span class="st st-x" title="рейс отменён">${ICON.x}отмена</span>`;
  if (!t.realTime) return `<span class="st st-sched" title="только расписание">${ICON.sched}</span>`;
  const d = Math.round((new Date(t.dep) - new Date(t.depSched)) / 60000);
  if (d > 0) return `<span class="st st-late" title="опоздание">${ICON.late}+${d} мин</span>`;
  if (d < 0) return `<span class="st st-early" title="раньше расписания">${ICON.early}−${-d} мин</span>`;
  return `<span class="st st-ok" title="вовремя">${ICON.ok}</span>`;
}

function pathSvg(back) {
  // волнистая светящаяся линия со стрелкой; у «обратной» — изгиб в другую сторону
  const d = back ? "M6 22 C40 22 50 42 90 40 S150 18 196 30" : "M6 34 C46 34 56 14 96 20 S150 44 196 28";
  return `<svg class="path" viewBox="0 0 210 60" preserveAspectRatio="none" aria-hidden="true">
    <path class="glow" d="${d}"/><path class="dash" d="${d}"/>
    <path class="head2" d="${back ? "M196 30 l-10 -7 l2 7 l-2 7z" : "M196 28 l-10 -7 l2 7 l-2 7z"}"/></svg>`;
}

function statusOf(t) {
  if (t.cancelled) return { cls: "late", txt: "рейс отменён" };
  if (!t.realTime) return { cls: "", txt: "по расписанию" };
  const delay = Math.round((new Date(t.dep) - new Date(t.depSched)) / 60000);
  if (delay > 0) return { cls: "late", txt: `опоздание +${delay} мин` };
  if (delay < 0) return { cls: "early", txt: `раньше на ${-delay} мин` };
  return { cls: "ontime", txt: "вовремя" };
}

// Собака на самокате (рисунок пользователя): хвост покачивается, на колёсах крутятся спицы.
// Едет по тонкой дороге с камушками и подпрыгивает, когда колесо наезжает на камушек.
const CAT_SVG = `<svg class="cat" viewBox="0 0 320 313" aria-hidden="true"><image href="dog.png?v=30" width="320" height="313"/><g><image href="dog-tail.png?v=30" width="320" height="313"/><animateTransform attributeName="transform" type="rotate" values="-6 87.84 190.04;7 87.84 190.04;-6 87.84 190.04" dur="1.1s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></g><g transform="translate(292.02 286.84) rotate(171.1) scale(25.34 23.54)"><g><path d="M-.62 0H.62M0 -.62V.62" stroke="#15161c" stroke-width="1.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.45s" repeatCount="indefinite"/></g></g><g transform="translate(127.67 268.34) rotate(-91.8) scale(23.58 18.3)"><g><path d="M-.62 0H.62M0 -.62V.62" stroke="#15161c" stroke-width="1.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.45s" repeatCount="indefinite"/></g></g><g class="tongue" transform="translate(272.77 98.63) scale(1.6 0)"><path d="M-5.2 0 C-5.8 14 -3.2 20.5 0 20.5 C3.2 20.5 5.8 14 5.2 0 Z" fill="#ff5a6e" stroke="#15161c" stroke-width="1.5" stroke-linejoin="round"/><path d="M0 1.5 V12" stroke="#c23048" stroke-width="1" stroke-linecap="round"/></g></svg>`;
const CAT_FRONT = 0.9126, CAT_REAR_GAP = 0.5136;      // переднее колесо и расстояние до заднего (доли ширины рисунка)
const PEBBLES = [[6,1.9],[22.7,2.2],[37.6,1.3],[53.5,1.3],[66.7,1.3],[83.2,1.6],[94.4,2.2],[107.9,1.6],[119.5,2.2],[130.8,2.6],[142.5,1.6],[157.3,2.6],[174.0,2.6],[188.5,1.3],[205.4,1.3],[219.7,1.6],[232.5,1.6],[246.7,2.6],[259.6,1.6],[271.2,2.6],[286.0,1.9],[297.6,1.3],[312.0,2.6]];   // пунктир из камушков: x и размер (из 320)
const ROAD_Y = 13;
function routeSvg(via, phase) {
  return `<div class="anim" data-phase="${phase}">
    <svg class="road" viewBox="0 0 320 16" preserveAspectRatio="xMidYMid meet">
      ${PEBBLES.map(([x, s]) => `<ellipse class="pb" cx="${x}" cy="${ROAD_Y - s * .45}" rx="${s}" ry="${s * .72}"/>`).join("")}
    </svg>
    <span class="rider">${CAT_SVG}</span>
  </div>`;
}
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const CYCLE = 15000;                                   // полный круг, мс (медленнее)
function animRoutes(now) {
  document.querySelectorAll(".anim").forEach(el => {
    const ph = +el.dataset.phase || 0;
    const dir = el.closest(".card.back") ? -1 : 1;          // в Schanz — справа налево
    const p = (((now + ph) % CYCLE) + CYCLE) % CYCLE / CYCLE;
    const t = p < .9 ? p / .9 : 1;                          // последние 10% круга — пауза (кота не видно)
    // посередине пути притормаживает: скорость 1 + k·cos(2πt) → у середины почти стоит
    const k = .88, f = RM ? .5 : t + (k / (2 * Math.PI)) * Math.sin(2 * Math.PI * t);
    const W = el.clientWidth, rider = el.querySelector(".rider"), cw = rider.offsetWidth || 0;
    const fw = dir > 0 ? cw * CAT_FRONT : cw * (1 - CAT_FRONT);   // где переднее колесо внутри рисунка
    const from = dir > 0 ? fw + 2 : W - (cw - fw) - 2;
    const to = dir > 0 ? W - (cw - fw) - 2 : fw + 2;
    const xp = from + (to - from) * f;                       // переднее колесо
    const xr = xp - dir * cw * CAT_REAR_GAP;                 // заднее колесо
    const reach = Math.max(cw * .045, 3.5);
    const bump = x => PEBBLES.reduce((m, [px]) => Math.max(m, 1 - Math.abs(x - px * W / 320) / reach), 0);
    const speed = 1 + k * Math.cos(2 * Math.PI * t);         // 0.12 … 1.88
    const hopK = Math.min(1, speed);                         // медленно — почти не подпрыгивает
    const bf = RM ? 0 : bump(xp) * hopK, br = RM ? 0 : bump(xr) * hopK;
    const hop = 2.6 * Math.max(bf, br), tilt = dir * 2.2 * (br - bf);
    // плавно появляется (первые 12% пути) и долго растворяется (последние 30%)
    const sm = v => v <= 0 ? 0 : v >= 1 ? 1 : v * v * (3 - 2 * v);
    const op = RM ? 1 : (p >= .9 ? 0 : sm(t / .12) * sm((1 - t) / .3));
    rider.style.opacity = op.toFixed(3);
    rider.style.left = (xp - fw) + "px";
    rider.style.transform = `translateY(${-hop}px) rotate(${tilt}deg)`;
    // язык: показывает, пока притормаживает посередине
    const tg = rider.querySelector(".tongue");
    if (tg) {
      const d = Math.abs(t - .5), s = RM ? 0 : sm((.1 - d) / .05);
      tg.setAttribute("transform", `translate(272.77 98.63) scale(1.6 ${(1.6 * s).toFixed(3)})`);
    }
  });
  if (!RM) requestAnimationFrame(animRoutes);
}
requestAnimationFrame(animRoutes);

// 1 минута, 2 минуты, 5 минут, 21 минута, 12 минут
const minWord = n => (n % 10 === 1 && n % 100 !== 11) ? "минута"
  : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? "минуты" : "минут";

function cardHtml(d) {
  const k = keyOf(d), st = state[k], now = Date.now();
  const trips = st ? st.trips.filter(t => new Date(t.dep).getTime() > now - 30_000) : [];
  const active = trips.filter(t => !t.cancelled);
  const n0 = active[0], n1 = active[1];
  const n0Via = n0 ? (Number.isFinite(n0.via) ? n0.via : 3) : null;
  let big, meta, row3 = "";
  if (!st) {
    big = "…"; meta = `<span class="muted">Загрузка расписания</span>`;
  } else if (!n0) {
    big = "Нет рейсов"; meta = `<span class="muted">Прямых автобусов в ближайшие ${WINDOW_MIN} мин нет</span>`;
  } else {
    const m = minsTo(n0.dep, now), s = statusOf(n0);
    big = m <= 0 ? "Сейчас" : `<span class="w">Ожидание</span> ${m} ${minWord(m)}`;
    meta = `${ICON.clock}<span>${hm(n0.dep)}</span>${badge(n0)}` +
           (n1 ? `<span class="sep">·</span><span>далее ${hm(n1.dep)}</span>` : "");
    const lines = [...new Set(active.slice(0, 3).map(t => t.line))].slice(0, 3);
    const ride = Math.round((new Date(n0.arr) - new Date(n0.dep)) / 60000);
    const track = (n0.track || "").replace(/\s*\(.*\)\s*$/, "");
    row3 = `<div class="lines">${lines.map(l => `<span class="ln-av">${esc(l)}</span>`).join("")}</div>
      <div class="stats"><span>${ICON.ride}${ride} мин</span>${track ? `<span class="trk">${esc(track)}</span>` : ""}</div>`;
  }
  return `<section class="card ${d.cls}" data-k="${k}">
    <div class="row1"><span class="tag">${STOPS[d.from].name} → ${STOPS[d.to].name}</span><span class="route-s"></span>
      <button class="circle more" type="button" data-k="${k}" aria-label="Все рейсы">${ICON.more}</button></div>
    <div class="big">${big}</div>
    ${n0Via != null ? routeSvg(n0Via, 0) : ""}
    <div class="meta">${meta}</div>
    ${row3 ? `<div class="row3">${row3}</div>` : ""}
  </section>`;
}

function sheetRows(k) {
  const st = state[k], now = Date.now();
  const trips = st ? st.trips.filter(t => new Date(t.dep).getTime() > now - 30_000) : [];
  if (!trips.length) return `<li class="empty">Нет данных</li>`;
  return trips.map(t => {
    const m = minsTo(t.dep, now), s = statusOf(t);
    return `<li class="${t.cancelled ? "cancelled" : ""}">
      <span class="ln">${esc(t.line)}</span>
      <span class="t">${hm(t.dep)}</span>
      <span class="in">${t.cancelled ? "отмена" : m <= 0 ? "сейчас" : m + " мин"}</span>
      <span class="sub">${badge(t)}${s.cls === "late" && !t.cancelled ? ` план ${hm(t.depSched)}` : ""} · прибытие ${hm(t.arr)}${t.headsign ? " · → " + esc(t.headsign) : ""}${t.track ? " · стоянка " + esc(t.track) : ""}</span>
    </li>`;
  }).join("");
}

function legendHtml() {
  return `<span class="st st-ok">${ICON.ok}</span> вовремя · <span class="st st-late">${ICON.late}+N</span> опоздание · <span class="st st-sched">${ICON.sched}</span> только расписание.<br>Время немецкое. Данные: <a href="https://transitous.org/sources/" target="_blank" rel="noopener" style="color:inherit">Transitous</a> (DELFI / AVV).`;

function render() {

  $("slot1").innerHTML = cardHtml(ds[1]);
  const ats = dirs().map(d => state[keyOf(d)] && state[keyOf(d)].at).filter(Boolean);

  const st = $("status");
  st.classList.toggle("warn", !!notice);
  st.innerHTML = (notice ? "⚠ " + notice
    : ats.length ? `Обновлено ${fmtS.format(new Date(Math.min(...ats)))}${paused ? " · пауза" : ""}`
    : (Object.keys(inflight).length ? "Загрузка…" : "Нет данных"))
    + `<br>Данные: <a href="https://transitous.org/sources/" target="_blank" rel="noopener">Transitous</a>`;

// Подгонка под экран: если что-то не влезает (длинный статус ушёл на 2 строки, маленький экран и т.п.),
// шаг за шагом уменьшаем размеры карточек, пока всё не поместится. Так прокрутка не появится ни при каком тексте.
function viewH() {
  // реальная видимая высота (на Android в установленном приложении 100vh бывает больше видимой части)
  const v = [innerHeight, document.documentElement.clientHeight, window.visualViewport && visualViewport.height].filter(x => x > 0);
  return Math.floor(Math.min(...v));
}
function fit() {
  const root = document.documentElement, main = document.querySelector("main");
  const vh = viewH();
  main.style.height = vh + "px";
  const over = () => main.scrollHeight > main.clientHeight + 1 || main.getBoundingClientRect().bottom > vh + 1 ||
    [...document.querySelectorAll(".card")].some(c => c.scrollHeight > c.clientHeight + 1) ||
    [...document.querySelectorAll(".row3, .row1")].some(e => e.scrollWidth > e.clientWidth + 1);
  const bigs = [...document.querySelectorAll(".big")];
  bigs.forEach(b => { b.style.fontSize = ""; });
  let k = 1;
  root.style.setProperty("--k", k);
  while (over() && k > 0.5) { k = Math.round((k - 0.03) * 100) / 100; root.style.setProperty("--k", k); }
  // главная надпись («Ожидание 13 минут») сама уменьшается под ширину своей карточки
  bigs.forEach(b => {
    let fs = parseFloat(getComputedStyle(b).fontSize);
    while (b.scrollWidth > b.clientWidth + 1 && fs > 16) { fs -= 1; b.style.fontSize = fs + "px"; }
  });
}
let fitTimer;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 80); };
addEventListener("resize", refit);
addEventListener("orientationchange", refit);
if (window.visualViewport) visualViewport.addEventListener("resize", refit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

function setBanner(text) { notice = text || ""; }

function load(k) {
  if (!inflight[k]) {
    inflight[k] = doLoad(k).finally(() => { delete inflight[k]; render(); });
    render();
  }
  return inflight[k];
}

async function doLoad(k) {
  const [a, b] = k.split(">");
  try {
    const time = new Date(Date.now() - 60_000).toISOString();
    let trips;
    try {
      trips = await boardTrips(await resolveStop(a, false), a, b, time);
    } catch (e1) {
      if (e1.network) throw e1;                      // нет связи — сразу показываем сохранённое
      console.warn("способ 1:", e1);
      try {                                          // возможно, ID остановки поменялся — ищем заново
        trips = await boardTrips(await resolveStop(a, true), a, b, time);
      } catch (e2) {
        if (e2.network) throw e2;
        console.warn("способ 1, повтор:", e2);
        trips = await planTrips(a, b, time);         // запасной способ
      }
    }
    state[k] = { trips, at: Date.now() };
    store.set("cache3:" + k, state[k]);
    lastError = null; setBanner("");
  } catch (e) {
    console.error(e);
    lastError = e;
    const cached = state[k] || store.get("cache3:" + k);
    if (cached) {
      state[k] = cached;
      setBanner(`Нет связи · данные от ${fmt.format(new Date(cached.at))}`);
    } else {
      state[k] = { trips: [], at: 0 };
      setBanner("Нет связи · нажмите ↻");
    }
  }
}

function loadAll() { dirs().forEach(d => load(keyOf(d))); }

function touchAndLoad() { lastTouch = Date.now(); loadAll(); }

// ===== События =====
// долгое нажатие не вызывает меню браузера (копировать / поиск / календарь)
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-w]"); if (!b || b.dataset.w === work) return;
  work = b.dataset.w; store.set("work", work); lastTouch = Date.now();
  dirs().forEach(d => { const k = keyOf(d); if (!state[k]) { const c = store.get("cache3:" + k); if (c) state[k] = c; } });
  closeSheet(); renderSeg(); render(); loadAll();
});
$("cards").addEventListener("click", e => {
  const b = e.target.closest(".more"); if (!b) return;
  lastTouch = Date.now(); openSheet(b.dataset.k);
});
$("sheet").addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Панель «Все рейсы» — это шаг в истории браузера: жест/кнопка «Назад» на Android закрывает её, а не приложение.
function openSheet(k) {
  const wasOpen = !!sheetKey;
  sheetKey = k; renderSheet();
  if (!wasOpen) { try { history.pushState({ sheet: true }, ""); } catch {} }
}
function closeSheet(fromBack) {
  if (!sheetKey) return;
  sheetKey = null; renderSheet();
  if (!fromBack && history.state && history.state.sheet) { try { history.back(); } catch {} }
}
addEventListener("popstate", () => { if (sheetKey) closeSheet(true); });
// если страницу перезагрузили с открытой панелью в истории — начинаем с чистого состояния
if (history.state && history.state.sheet) { try { history.replaceState(null, ""); } catch {} }
$("fab").addEventListener("click", touchAndLoad);
document.addEventListener("visibilitychange", () => { if (!document.hidden) touchAndLoad(); });

setInterval(() => {
  if (document.hidden) return;
  const fresh = Date.now() - lastTouch < AUTO_REFRESH_LIMIT_MS;
  dirs().forEach(d => {
    const st = state[keyOf(d)];
    if (fresh && (!st || Date.now() - st.at >= REFRESH_MS)) load(keyOf(d));
  });
  render();                                         // пересчёт «через N мин»
}, 10_000);

// ===== Самообновление =====
// Если на сайте вышла новая версия, приложение перезагружается само (раз в 10 минут и при каждом возвращении в приложение).
const APP_VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || "";
async function checkUpdate() {
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
    if (!m || m[1] === APP_VERSION) return;
    let tried = null; try { tried = sessionStorage.getItem("triedVersion"); } catch {}
    if (tried === m[1]) return;                       // уже пробовали — не зацикливаемся
    try { sessionStorage.setItem("triedVersion", m[1]); } catch {}
    location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));   // новый адрес — мимо кэша
  } catch {}
}
setInterval(checkUpdate, 10 * 60_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
setTimeout(checkUpdate, 3000);

// старт: сразу показать сохранённое, потом загрузить свежее
dirs().forEach(d => { const k = keyOf(d); const c = store.get("cache3:" + k); if (c) state[k] = c; });
renderSeg(); render(); loadAll();
</script>
</body>
