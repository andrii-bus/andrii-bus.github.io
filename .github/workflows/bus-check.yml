name: bus-check
# Checks the site: data source answers, CORS is open, and the live page shows departures in a real browser.
on:
  push:
    branches: [main]
    paths: ['**']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Stops in the data source
        run: |
          for q in "Schanz (Jakobstraße) Aachen" "Bushof Aachen" "Kaiserplatz Aachen"; do
            echo "=== $q"
            curl -sS -G "https://api.transitous.org/api/v1/geocode" -H "Referer: https://andrii-bus.github.io/" \
              --data-urlencode "text=$q" --data-urlencode "type=STOP" --data-urlencode "numResults=20" --data-urlencode "place=50.7753,6.0839" \
              | jq -c '.[:3][] | {name,id}'
          done
      - name: CORS
        run: |
          curl -sS -D - -o /dev/null -H "Origin: https://andrii-bus.github.io" \
            "https://api.transitous.org/api/v1/geocode?text=Bushof%20Aachen&type=STOP" | grep -i -E "^(HTTP|access-control)"
      - name: Wait for the deployed page
        run: |
          for i in $(seq 1 40); do
            if curl -sS "https://andrii-bus.github.io/?t=$(date +%s)" | grep -q 'bus-v23'; then echo "live"; exit 0; fi
            sleep 15
          done
          echo "page not live"; exit 1
      - name: Open the page in Chromium
        run: |
          npm i --no-save playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > check.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport:{width:390,height:844}, timezoneId:'Europe/Berlin', locale:'ru-RU' });
          p.on('console', m => console.log('[console]', m.type(), m.text()));
          p.on('requestfailed', r => console.log('[failed]', r.url(), r.failure()?.errorText));
          p.on('response', r => { if (r.url().includes('transitous')) console.log('[api]', r.status(), r.url().slice(0,160)); });
          await p.goto('https://andrii-bus.github.io/?t=' + Date.now());
          await p.setViewportSize({ width: 412, height: 780 });   // Pixel 7, Chrome
          for (const w of ['bushof','kaiserplatz']) {
            await p.locator(`#seg button[data-w=${w}]`).click();
            await p.waitForTimeout(500);
            await p.waitForFunction(() => /Обновлено/.test(document.getElementById('status').textContent) && !document.getElementById('fab').classList.contains('busy'), null, {timeout:60000}).catch(()=>console.log('TIMEOUT waiting for data'));
            console.log('\n##### Работа: ' + w);
            console.log('status:', await p.locator('#status').innerText());
            console.log('route animation:', JSON.stringify(await p.evaluate(() => [...document.querySelectorAll('.anim svg')].map(s => ({ stops: s.querySelectorAll('.sd').length, bus: s.querySelector('.bus').getAttribute('transform') })))));
            console.log('fits one screen:', JSON.stringify(await p.evaluate(() => ({ inner: innerHeight, scroll: document.scrollingElement.scrollHeight }))));
            for (const c of await p.locator('.card').all()) console.log('-----\n' + (await c.innerText()));
            for (let i = 0; i < 2; i++) {
              await p.locator('.card .more').nth(i).click();
              console.log('== list: ' + await p.locator('#sheetTitle').innerText() + '\n' + (await p.locator('#sheetList').innerText()).slice(0, 1500));
              await p.locator('#sheet [data-close]').click();
            }
            await p.screenshot({ path: `shot-${w}.png` });
          }
          // Pixel 7 screen; also simulate Android reporting 100dvh taller than the visible area
          await p.setViewportSize({ width: 411, height: 914 });
          await p.addStyleTag({ content: 'main{height:calc(100dvh + 60px)}' });
          await p.evaluate(() => fit()); await p.waitForTimeout(500);
          console.log('pixel7 + tall-vh bug:', JSON.stringify(await p.evaluate(() => ({ inner: innerHeight, scroll: document.scrollingElement.scrollHeight,
            main: Math.round(document.querySelector('main').getBoundingClientRect().height), refreshBottom: Math.round(document.getElementById('fab').getBoundingClientRect().bottom),
            k: getComputedStyle(document.documentElement).getPropertyValue('--k') }))));
          for (const [w,h,n] of [[393,852,'iPhone 16'],[402,874,'iPhone 17 / 16 Pro'],[440,956,'iPhone 17 Pro Max'],[393,659,'iPhone 16 Safari tab']]) {
            await p.setViewportSize({ width: w, height: h }); await p.evaluate(() => fit()); await p.waitForTimeout(300);
            console.log(n + ':', JSON.stringify(await p.evaluate(() => ({ inner: innerHeight, scroll: document.scrollingElement.scrollHeight,
              refreshBottom: Math.round(document.getElementById('fab').getBoundingClientRect().bottom), k: getComputedStyle(document.documentElement).getPropertyValue('--k') }))));
          }
          await b.close();
          JS
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: 'shot-*.png' }
