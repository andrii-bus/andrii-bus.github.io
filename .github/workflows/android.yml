name: android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        id: key
        env:
          PASS: ${{ secrets.ANDROID_KEY_PASS }}
          KSP: labus-release-key
        run: |
          if [ -z "$PASS" ]; then
            echo "::warning::Нет пароля ANDROID_KEY_PASS: сборка подписана временным ключом, релиз не публикуется"
            exit 0
          fi
          ENC=android/signing/labus.p12.enc
          if [ ! -f "$ENC" ]; then
            # первый запуск: создаём постоянный ключ и сохраняем его в репозитории только в зашифрованном виде
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/labus.p12" -storepass "$KSP" -keypass "$KSP" \
              -alias labus -keyalg EC -groupname secp256r1 -validity 18250 -dname "CN=LA Bus, O=andrii-bus, C=DE"
            mkdir -p android/signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/labus.p12" -out "$ENC" -pass env:PASS
            git add "$ENC"
            git -c user.name="LA Bus CI" -c user.email="ci@localhost" commit -qm "Зашифрованный ключ подписи LA Bus"
            git push -q origin HEAD:main
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$RUNNER_TEMP/labus.p12" -pass env:PASS
          fi
          echo "KS_PATH=$RUNNER_TEMP/labus.p12" >> "$GITHUB_ENV"
          echo "signed=1" >> "$GITHUB_OUTPUT"
      - name: Build APK
        working-directory: android
        env:
          KS_PASS: labus-release-key
          VCODE: ${{ github.run_number }}
          VNAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk LA-Bus.apk && ls -la LA-Bus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: LA-Bus.apk

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/emu-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: shots/
      - name: Screenshots to ci-shots branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd shots && rm -f logcat-full.txt
          git init -q && git checkout -q -b ci-shots && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "emulator shots, run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-shots

  release:
    needs: [build, test]
    if: needs.build.outputs.signed == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" LA-Bus.apk \
            -R "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "LA Bus для Android · сборка ${{ github.run_number }}" \
            --notes "Установка: скачать LA-Bus.apk на телефон и открыть."
